<!DOCTYPE html>
<html>
    <head>
        <title>$title$ - Kiln Example Site</title>
        ${ component/common_head() }
    </head>
    <body>
        ${ component/navbar() }
        <div class="header">
            <h1>$title$</h1>
            <p class="author">$author$<br>$date$</p>
        </div>
        <div class="abstract">
            $abstract$
        </div>
        <nav role="navigation" class="toc">
            <h2>
                Contents
                <button type="button" class="icon icon-button" id="toc-control" aria-label="Toggle contents" aria-expanded="true" aria-controls="toc-items">
                    <i class="material-icons" id="toc-control-icon" aria-hidden="true">remove</i>
                </button>
            </h2>
            <div id="toc-items" style="display: inherit;">
                $toc$
            </div>
        </nav>
        <main>
            $body$
        </main>
        ${ component/navigator() }
        ${ component/search_panel() }
        ${ component/footnotes() }
    </body>
</html>
