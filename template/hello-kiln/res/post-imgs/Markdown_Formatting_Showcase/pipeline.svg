<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <style>
    .box { fill: none; stroke: #333; stroke-width: 2; }
    .label { font-family: sans-serif; font-size: 16px; fill: #333; text-anchor: middle; }
    .arrow { stroke: #333; stroke-width: 2; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="35" width="140" height="50" rx="6"/>
  <text class="label" x="80" y="65">src/*.md</text>

  <line class="arrow" x1="150" y1="60" x2="205" y2="60"/>

  <rect class="box" x="210" y="35" width="140" height="50" rx="6"/>
  <text class="label" x="280" y="65">Pandoc</text>

  <line class="arrow" x1="350" y1="60" x2="405" y2="60"/>

  <rect class="box" x="410" y="35" width="140" height="50" rx="6"/>
  <text class="label" x="480" y="65">post/*.html</text>
</svg>
