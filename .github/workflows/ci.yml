name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build kiln (runs the cabal test suite via the Nix check phase)
        run: nix build .#kiln -L

      - name: Smoke-test help + version
        run: |
          kiln="$PWD/result/bin/kiln"
          "$kiln" help | grep -q "Usage: kiln"
          "$kiln" version | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Smoke-test init + build with the built binary
        run: |
          kiln="$PWD/result/bin/kiln"
          for template in default flow; do
            scratch=$(mktemp -d)
            cd "$scratch"
            "$kiln" init "$template"
            "$kiln" build
            test -f index.html
            if [ "$template" = default ]; then
              test -f searchdb.json
            else
              test ! -f searchdb.json
            fi
            "$kiln" clean
            cd "$OLDPWD"
          done
